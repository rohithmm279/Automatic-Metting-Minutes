services:
  - type: web
    name: s5-meeting-minutes-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: https://s5-meeting-minutes-ui.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: MEETING_TWO_PASS
        value: "false"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:3b

  - type: static
    name: s5-meeting-minutes-ui
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://s5-meeting-minutes-api.onrender.com
