services:
  - type: web
    name: s5-meeting-minutes-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: https://s5-meeting-minutes-ui.onrender.com,https://automatic-metting-minutes-1.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: MEETING_TWO_PASS
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b

  - type: web
    name: s5-meeting-minutes-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://s5-meeting-minutes-api.onrender.com